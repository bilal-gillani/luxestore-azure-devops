trigger:
  - none

pool:
  vmImage: ubuntu-latest

# ============================================================
# Pipeline Variables
# ============================================================
variables:
  - group: 'luxestore-secrets'

  - name: azureServiceConnection
    value: 'azure-service-connection-name'
  
  - name: acrName
    value: 'acr-name'
  - name: acrLoginServer
    value: '$(acrName).azurecr.io'

  # Image repository names inside ACR
  - name: backendRepository
    value: 'luxestore-backend'
  - name: frontendRepository
    value: 'luxestore-frontend'

  # Azure Infrastructure & Database Variables
  - name: resourceGroupName
    value: 'rg-name'
  - name: mysqlServerName
    value: 'mysql-server-name'
  - name: mysqlServerFqdn
    value: '$(mysqlServerName).mysql.database.azure.com'
  - name: mysqlAdminUsername
    value: 'sqladmin'

  # Remote Terraform State in Azure Storage
  - name: tfStorageResourceGroup
    value: 'tf-storage-rg-name'
  - name: tfStorageAccount
    value: 'tf-storage-account-name'
  - name: tfStateContainer
    value: 'tfstate'
  - name: tfStateKey
    value: 'tf-state-key'

stages:
  # ============================================================
  # Stage 1: Build Stage (Continuous Integration - CI)
  # ============================================================
  - stage: Build
    displayName: 'Build & Push (CI)'
    jobs:
      - job: BuildAndPushJob
        displayName: 'Test, Build & Push Images'
        steps:
          # --- Step 1: Fast Feedback / Code & Dependency Check ---
          - script: |
              echo "=== Verifying Backend Code ==="
              cd ecommerce-backend
              npm ci --omit=dev || npm install --omit=dev
              node --check server.js
              echo "✅ Backend syntax and dependencies validated!"
            displayName: 'Validate Backend Dependencies & Syntax'

          # --- Step 2: Authenticate Docker to ACR via ARM Service Connection ---
          # The SP (with AcrPush role on ACR) logs Docker into the registry.
          # Credentials are stored in ~/.docker/config.json on the agent
          # and persist for all subsequent steps in this job.
          - task: AzureCLI@2
            displayName: 'Login to ACR'
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                echo "=== Authenticating Docker to ACR ==="
                az acr login --name $(acrName)
                echo "✅ Logged in to $(acrLoginServer)"

          # --- Step 3: Build & Push Backend Docker Image ---
          - task: AzureCLI@2
            displayName: 'Build and Push Backend Image to ACR'
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                echo "=== Building Backend Image ==="
                docker build \
                  -t $(acrLoginServer)/$(backendRepository):$(Build.BuildId) \
                  -t $(acrLoginServer)/$(backendRepository):latest \
                  -f ecommerce-backend/Dockerfile \
                  ecommerce-backend/

                echo "=== Pushing Backend Image ==="
                docker push $(acrLoginServer)/$(backendRepository):$(Build.BuildId)
                docker push $(acrLoginServer)/$(backendRepository):latest
                echo "✅ Backend pushed → $(acrLoginServer)/$(backendRepository):$(Build.BuildId)"

          # --- Step 4: Build & Push Frontend Docker Image ---
          - task: AzureCLI@2
            displayName: 'Build and Push Frontend Image to ACR'
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                echo "=== Building Frontend Image ==="
                docker build \
                  -t $(acrLoginServer)/$(frontendRepository):$(Build.BuildId) \
                  -t $(acrLoginServer)/$(frontendRepository):latest \
                  -f html/Dockerfile \
                  html/

                echo "=== Pushing Frontend Image ==="
                docker push $(acrLoginServer)/$(frontendRepository):$(Build.BuildId)
                docker push $(acrLoginServer)/$(frontendRepository):latest
                echo "✅ Frontend pushed → $(acrLoginServer)/$(frontendRepository):$(Build.BuildId)"

  # ============================================================
  # Stage 2: Release Stage (Continuous Deployment - CD)
  # ============================================================
  - stage: Deploy
    displayName: 'Deploy (CD)'
    dependsOn: Build
    condition: succeeded()
    jobs:
      - job: DeployJob
        displayName: 'Deployment Job'
        steps:
        - task: TerraformInstaller@1
          displayName: 'Install Terraform'
          inputs:
            terraformVersion: 'latest'
        - task: TerraformTask@5
          displayName: 'Terraform Init'
          inputs:
            provider: 'azurerm'
            command: 'init'
            workingDirectory: '$(System.DefaultWorkingDirectory)/infra'
            backendServiceArm: '$(azureServiceConnection)'
            backendAzureRmResourceGroupName: '$(tfStorageResourceGroup)'
            backendAzureRmStorageAccountName: '$(tfStorageAccount)'
            backendAzureRmContainerName: '$(tfStateContainer)'
            backendAzureRmKey: '$(tfStateKey)'
        - task: TerraformTask@5
          displayName: 'Terraform Plan'
          inputs:
            provider: 'azurerm'
            command: 'plan'
            workingDirectory: '$(System.DefaultWorkingDirectory)/infra'
            commandOptions: '-out tfplan -var="resource_group_name=$(resourceGroupName)" -var="mysql_server_name=$(mysqlServerName)" -var="acr_name=$(acrName)" -var="image_tag=$(Build.BuildId)"'
            environmentServiceNameAzureRM: '$(azureServiceConnection)'
            environmentAzureRmUseIdTokenGeneration: true
        - task: TerraformTask@5
          displayName: 'Terraform Apply'
          inputs:
            provider: 'azurerm'
            command: 'apply'
            workingDirectory: '$(System.DefaultWorkingDirectory)/infra'
            commandOptions: 'tfplan'
            environmentServiceNameAzureRM: '$(azureServiceConnection)'
            environmentAzureRmUseIdTokenGeneration: true

        # --- Step 4: Initialize Database Schema, App User & Seed Data ---
        - task: AzureCLI@2
          displayName: 'Initialize & Seed Azure MySQL Database'
          inputs:
            azureSubscription: '$(azureServiceConnection)'
            scriptType: bash
            scriptLocation: inlineScript
            inlineScript: |
              set -euo pipefail
              echo "=== Installing MySQL Client ==="
              sudo apt-get update -qq && sudo apt-get install -y -qq default-mysql-client

              echo "=== Executing Database Initialization Script ==="
              chmod +x scripts/init-db.sh
              ./scripts/init-db.sh "$(mysqlServerFqdn)" "$(mysqlAdminUsername)"
          env:
            MYSQL_ADMIN_PASSWORD: $(MYSQL_ADMIN_PASSWORD)
            APP_DB_PASSWORD: $(APP_DB_PASSWORD)

        # --- Step 5: Output Application URLs & Verify Deployment ---
        - task: AzureCLI@2
          displayName: 'Verify & Output Application URL'
          inputs:
            azureSubscription: '$(azureServiceConnection)'
            scriptType: bash
            scriptLocation: inlineScript
            inlineScript: |
              set -euo pipefail
              echo "=== Retrieving Container App URLs ==="
              FRONTEND_FQDN=$(az containerapp show --resource-group "$(resourceGroupName)" --name frontend --query "properties.configuration.ingress.fqdn" -o tsv || echo "")
              BACKEND_FQDN=$(az containerapp show --resource-group "$(resourceGroupName)" --name backend --query "properties.configuration.ingress.fqdn" -o tsv || echo "")

              echo "=================================================="
              echo "🚀 Deployment Successful!"
              echo "🌐 Frontend Public URL: https://$FRONTEND_FQDN"
              echo "⚙️ Backend Internal FQDN: $BACKEND_FQDN"
              echo "=================================================="