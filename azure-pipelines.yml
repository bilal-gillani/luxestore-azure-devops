trigger:
  - main

pool:
  vmImage: ubuntu-latest

stages:
  # ============================================================
  # Stage 1: Build Stage (Continuous Integration - CI)
  # ============================================================
  - stage: Build
    displayName: 'Build (CI)'
    jobs:
      - job: BuildJob
        displayName: 'Build & Test Job'
        steps:
          - script: echo "🚀 Starting LuxeStore CI/CD Pipeline Build!"
            displayName: 'Print Welcome Message'

          - script: |
              echo "=== Agent Information ==="
              uname -a
              hostname
              echo "=== Tool Versions ==="
              node -v
              npm -v
              docker --version
            displayName: 'Check Pre-installed Tools'

          - script: |
              echo "=== Workspace Contents ==="
              pwd
              ls -la
            displayName: 'List Repository Files'

  # ============================================================
  # Stage 2: Release Stage (Continuous Deployment - CD)
  # ============================================================
  - stage: Deploy
    displayName: 'Deploy (CD)'
    dependsOn: Build
    condition: succeeded()
    jobs:
      - job: DeployJob
        displayName: 'Deployment Job'
        steps:
          - script: |
              echo "📦 Build stage passed successfully!"
              echo "Preparing to deploy to Azure Container Apps..."
            displayName: 'Deployment Preparation'
