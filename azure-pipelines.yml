trigger:
  - none

pool:
  vmImage: ubuntu-latest

# ============================================================
# Pipeline Variables
# ============================================================
variables:
  - group: 'luxestore-secrets'

  - name: azureServiceConnection
    value: 'azure-service-connection-name'
  
  - name: acrName
    value: 'acr-name'
  - name: acrLoginServer
    value: '$(acrName).azurecr.io'

  # Image repository names inside ACR
  - name: backendRepository
    value: 'luxestore-backend'
  - name: frontendRepository
    value: 'luxestore-frontend'

  # Azure Infrastructure & Database Variables
  - name: resourceGroupName
    value: 'rg-name'
  - name: mysqlServerName
    value: 'mysql-server-name'
  - name: mysqlServerFqdn
    value: '$(mysqlServerName).mysql.database.azure.com'
  - name: mysqlAdminUsername
    value: 'sqladmin'

  # Remote Terraform State in Azure Storage
  - name: tfStorageResourceGroup
    value: 'tf-storage-rg-name'
  - name: tfStorageAccount
    value: 'tf-storage-account-name'
  - name: tfStateContainer
    value: 'tfstate'
  - name: tfStateKey
    value: 'tf-state-key'

stages:
  # ============================================================
  # Stage 1: Build & Security Scan Stage (Continuous Integration - CI)
  # ============================================================
  - stage: Build
    displayName: 'Build, Scan & Push (CI)'
    jobs:
      - job: BuildAndPushJob
        displayName: 'Security Scan, Build & Push Images'
        steps:
          # --- Step 1: Secret Scanning (Gitleaks) ---
          # Runs first — fail fast before any build happens.
          # Scans the full git history and working tree for leaked secrets.
          # Config: .gitleaks.toml at repo root handles allowlisted false positives.
          - script: |
              echo "=== Running Gitleaks Secret Scanner ==="
              docker run --rm \
                -v "$(Build.SourcesDirectory):/repo" \
                ghcr.io/gitleaks/gitleaks:latest \
                detect \
                --source="/repo" \
                --config="/repo/.gitleaks.toml" \
                --redact \
                --verbose \
                --exit-code=1
              echo "✅ Gitleaks scan passed — no secrets detected!"
            displayName: 'Secret Scan (Gitleaks)'

          # --- Step 2: Backend Dependency Check + npm audit ---
          - script: |
              echo "=== Verifying Backend Code ==="
              cd ecommerce-backend
              npm ci --omit=dev || npm install --omit=dev
              node --check server.js
              echo "✅ Backend syntax and dependencies validated!"

              echo "=== Running npm Dependency Audit ==="
              # Fail on high or critical severity vulnerabilities in dependencies
              npm audit --audit-level=high --omit=dev || {
                echo "⚠️ npm audit found high/critical vulnerabilities!"
                exit 1
              }
              echo "✅ npm audit passed — no high/critical vulnerabilities!"
            displayName: 'Validate Backend Dependencies & npm Audit'

          # --- Step 3: Authenticate Docker to ACR ---
          # The SP (with AcrPush role on ACR) logs Docker into the registry.
          # Credentials are stored in ~/.docker/config.json on the agent
          # and persist for all subsequent steps in this job.
          - task: AzureCLI@2
            displayName: 'Login to ACR'
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                echo "=== Authenticating Docker to ACR ==="
                az acr login --name $(acrName)
                echo "✅ Logged in to $(acrLoginServer)"

          # --- Step 4: Install Trivy Container Scanner ---
          - script: |
              echo "=== Installing Trivy ==="
              curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
              trivy --version
              echo "✅ Trivy installed!"
            displayName: 'Install Trivy Scanner'

          # --- Step 5: Build Backend Image (No Push Yet) ---
          - task: AzureCLI@2
            displayName: 'Build Backend Docker Image'
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                echo "=== Building Backend Image ==="
                docker build \
                  -t $(acrLoginServer)/$(backendRepository):$(Build.BuildId) \
                  -t $(acrLoginServer)/$(backendRepository):latest \
                  -f ecommerce-backend/Dockerfile \
                  ecommerce-backend/
                echo "✅ Backend image built: $(acrLoginServer)/$(backendRepository):$(Build.BuildId)"

          # --- Step 6: Trivy Scan — Backend Image ---
          # Scans OS packages and Node.js packages inside the built image.
          # set -euo pipefail is REQUIRED: without it, bash swallows Trivy's
          # exit code 1 and the trailing echo exits 0 — making the step pass falsely.
          # set -euo pipefail
          - script: |
              
              echo "=== Scanning Backend Image with Trivy ==="
              trivy image \
                --severity CRITICAL,HIGH \
                --exit-code 1 \
                --ignore-unfixed \
                --ignorefile "$(Build.SourcesDirectory)/.trivyignore" \
                --format table \
                $(acrLoginServer)/$(backendRepository):$(Build.BuildId)
              echo "✅ Trivy backend scan passed — no fixable HIGH/CRITICAL vulnerabilities!"
            displayName: 'Trivy Scan — Backend Image'

          # --- Step 7: Push Backend Image to ACR (Only if Scan Passed) ---
          - task: AzureCLI@2
            displayName: 'Push Backend Image to ACR'
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                echo "=== Pushing Backend Image ==="
                docker push $(acrLoginServer)/$(backendRepository):$(Build.BuildId)
                docker push $(acrLoginServer)/$(backendRepository):latest
                echo "✅ Backend pushed → $(acrLoginServer)/$(backendRepository):$(Build.BuildId)"

          # --- Step 8: Build Frontend Image (No Push Yet) ---
          - task: AzureCLI@2
            displayName: 'Build Frontend Docker Image'
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                echo "=== Building Frontend Image ==="
                docker build \
                  -t $(acrLoginServer)/$(frontendRepository):$(Build.BuildId) \
                  -t $(acrLoginServer)/$(frontendRepository):latest \
                  -f html/Dockerfile \
                  html/
                echo "✅ Frontend image built: $(acrLoginServer)/$(frontendRepository):$(Build.BuildId)"

          # --- Step 9: Trivy Scan — Frontend Image ---
          # Scans OS packages inside the Nginx Alpine image.
          # set -euo pipefail is REQUIRED: without it, bash swallows Trivy's
          # exit code 1 and the trailing echo exits 0 — making the step pass falsely.
          # set -euo pipefail
          - script: |

              echo "=== Scanning Frontend Image with Trivy ==="
              trivy image \
                --severity CRITICAL,HIGH \
                --exit-code 1 \
                --ignore-unfixed \
                --ignorefile "$(Build.SourcesDirectory)/.trivyignore" \
                --format table \
                $(acrLoginServer)/$(frontendRepository):$(Build.BuildId)
              echo "✅ Trivy frontend scan passed — no fixable HIGH/CRITICAL vulnerabilities!"
            displayName: 'Trivy Scan — Frontend Image'

          # --- Step 10: Push Frontend Image to ACR (Only if Scan Passed) ---
          - task: AzureCLI@2
            displayName: 'Push Frontend Image to ACR'
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                echo "=== Pushing Frontend Image ==="
                docker push $(acrLoginServer)/$(frontendRepository):$(Build.BuildId)
                docker push $(acrLoginServer)/$(frontendRepository):latest
                echo "✅ Frontend pushed → $(acrLoginServer)/$(frontendRepository):$(Build.BuildId)"

          # --- Step 11: IaC Security Scan (Checkov) ---
          # Scans Terraform files in /infra for security misconfigurations.
          # Config: .checkov.yaml at repo root controls skipped checks and output format.
          # Runs AFTER images are built/pushed — no Terraform state access needed.
          # Fails the build if any non-skipped Checkov policy violations are found.
          - script: |
              echo "=== Installing Checkov ==="
              pip install checkov --quiet
              checkov --version

              echo "=== Running Checkov IaC Scan on /infra ==="
              checkov \
                --config-file "$(Build.SourcesDirectory)/.checkov.yaml" \
                --directory "$(Build.SourcesDirectory)/infra" \
                --framework terraform
              echo "✅ Checkov scan passed — no IaC security violations!"
            displayName: 'IaC Security Scan (Checkov)'


  # ============================================================
  # Stage 2: Terraform Plan
  # Runs Init + Plan with no approval gate — output is fully visible
  # to the approver before the approval prompt fires in Stage 3.
  # ============================================================
  - stage: TerraformPlan
    displayName: 'Terraform Init & Plan'
    dependsOn: Build
    condition: succeeded()
    jobs:
      - job: TerraformPlanJob
        displayName: 'Terraform Init & Plan'
        steps:
          - task: TerraformInstaller@1
            displayName: 'Install Terraform'
            inputs:
              terraformVersion: 'latest'

          - task: TerraformTask@5
            displayName: 'Terraform Init'
            inputs:
              provider: 'azurerm'
              command: 'init'
              workingDirectory: '$(System.DefaultWorkingDirectory)/infra'
              backendServiceArm: '$(azureServiceConnection)'
              backendAzureRmResourceGroupName: '$(tfStorageResourceGroup)'
              backendAzureRmStorageAccountName: '$(tfStorageAccount)'
              backendAzureRmContainerName: '$(tfStateContainer)'
              backendAzureRmKey: '$(tfStateKey)'

          - task: TerraformTask@5
            displayName: 'Terraform Plan'
            inputs:
              provider: 'azurerm'
              command: 'plan'
              workingDirectory: '$(System.DefaultWorkingDirectory)/infra'
              commandOptions: '-out tfplan -var="resource_group_name=$(resourceGroupName)" -var="mysql_server_name=$(mysqlServerName)" -var="db_password=$(APP_DB_PASSWORD)" -var="acr_name=$(acrName)" -var="jwt_secret=$(JWT_SECRET)" -var="image_tag=$(Build.BuildId)"'
              environmentServiceNameAzureRM: '$(azureServiceConnection)'
              environmentAzureRmUseIdTokenGeneration: true

          # Convert binary tfplan to human-readable text and publish as artifact.
          # Approver opens the "terraform-plan" artifact → tfplan.txt to review
          # exactly what will be created/changed/destroyed before approving.
          - script: |
              set -euo pipefail
              cd infra
              echo "=== Generating human-readable plan output ==="
              terraform show -no-color tfplan > tfplan.txt
              echo "📋 Plan saved to tfplan.txt — review in the Artifacts tab before approving."
            displayName: 'Save Terraform Plan as Text'

          - task: PublishPipelineArtifact@1
            displayName: 'Publish Terraform Plan Artifact'
            inputs:
              targetPath: '$(System.DefaultWorkingDirectory)/infra'
              artifact: 'terraform-plan'
              publishLocation: 'pipeline'

  # ============================================================
  # Stage 3: Terraform Apply + Deploy
  # The 'production' environment approval gate fires at stage ENTRY —
  # at this point Stage 2 logs and the terraform-plan artifact are
  # fully visible to the approver. Approve → Apply runs.
  #
  # SETUP REQUIRED (one-time in Azure DevOps UI):
  #   Pipelines → Environments → New environment → name: "production"
  #   → Approvals and checks → + → Approvals → add approver(s) → Save
  # ============================================================
  - stage: TerraformApply
    displayName: 'Terraform Apply & Deploy (Gated)'
    dependsOn: TerraformPlan
    condition: succeeded()
    jobs:
      - deployment: TerraformApplyJob
        displayName: 'Terraform Apply + DB Init + Verify'
        environment: 'production'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - task: TerraformInstaller@1
                  displayName: 'Install Terraform'
                  inputs:
                    terraformVersion: 'latest'

                # Re-run Init — each stage runs on a fresh agent; provider
                # plugins from Stage 2 are not available here.
                - task: TerraformTask@5
                  displayName: 'Terraform Init'
                  inputs:
                    provider: 'azurerm'
                    command: 'init'
                    workingDirectory: '$(System.DefaultWorkingDirectory)/infra'
                    backendServiceArm: '$(azureServiceConnection)'
                    backendAzureRmResourceGroupName: '$(tfStorageResourceGroup)'
                    backendAzureRmStorageAccountName: '$(tfStorageAccount)'
                    backendAzureRmContainerName: '$(tfStateContainer)'
                    backendAzureRmKey: '$(tfStateKey)'

                # Re-run Plan to produce a fresh tfplan binary on this agent.
                # The tfplan binary from Stage 2 is agent-specific and cannot
                # be transferred. The text artifact (tfplan.txt) was for review only.
                - task: TerraformTask@5
                  displayName: 'Terraform Plan (pre-apply re-plan)'
                  inputs:
                    provider: 'azurerm'
                    command: 'plan'
                    workingDirectory: '$(System.DefaultWorkingDirectory)/infra'
                    commandOptions: '-out tfplan -var="resource_group_name=$(resourceGroupName)" -var="mysql_server_name=$(mysqlServerName)" -var="db_password=$(APP_DB_PASSWORD)" -var="acr_name=$(acrName)" -var="jwt_secret=$(JWT_SECRET)" -var="image_tag=$(Build.BuildId)"'
                    environmentServiceNameAzureRM: '$(azureServiceConnection)'
                    environmentAzureRmUseIdTokenGeneration: true

                - task: TerraformTask@5
                  displayName: 'Terraform Apply'
                  inputs:
                    provider: 'azurerm'
                    command: 'apply'
                    workingDirectory: '$(System.DefaultWorkingDirectory)/infra'
                    commandOptions: 'tfplan'
                    environmentServiceNameAzureRM: '$(azureServiceConnection)'
                    environmentAzureRmUseIdTokenGeneration: true

                # --- Initialize Database Schema, App User & Seed Data ---
                - task: AzureCLI@2
                  displayName: 'Initialize & Seed Azure MySQL Database'
                  inputs:
                    azureSubscription: '$(azureServiceConnection)'
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail
                      echo "=== Installing MySQL Client ==="
                      sudo apt-get update -qq && sudo apt-get install -y -qq default-mysql-client

                      echo "=== Executing Database Initialization Script ==="
                      chmod +x scripts/init-db.sh
                      ./scripts/init-db.sh "$(mysqlServerFqdn)" "$(mysqlAdminUsername)"
                  env:
                    MYSQL_ADMIN_PASSWORD: $(MYSQL_ADMIN_PASSWORD)
                    APP_DB_PASSWORD: $(APP_DB_PASSWORD)

                # --- Output Application URLs & Verify Deployment ---
                - task: AzureCLI@2
                  displayName: 'Verify & Output Application URL'
                  inputs:
                    azureSubscription: '$(azureServiceConnection)'
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail
                      echo "=== Retrieving Container App URLs ==="
                      FRONTEND_FQDN=$(az containerapp show --resource-group "$(resourceGroupName)" --name frontend --query "properties.configuration.ingress.fqdn" -o tsv || echo "")
                      BACKEND_FQDN=$(az containerapp show --resource-group "$(resourceGroupName)" --name backend --query "properties.configuration.ingress.fqdn" -o tsv || echo "")

                      echo "=================================================="
                      echo "🚀 Deployment Successful!"
                      echo "🌐 Frontend Public URL: https://$FRONTEND_FQDN"
                      echo "⚙️  Backend Internal FQDN: $BACKEND_FQDN"
                      echo "=================================================="
