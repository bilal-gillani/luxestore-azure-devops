# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
- main

pool:
  vmImage: ubuntu-latest

steps:
- script: echo "Starting LuxeStore CI/CD Pipeline Build!"
  displayName: 'Print Welcome Message'

- script: |
    echo "=== Agent Information ==="
    uname -a
    hostname
    echo "=== Tool Versions ==="
    node -v
    npm -v
    docker --version
  displayName: 'Check Pre-installed Tools'

- script: |
    echo "=== Workspace Contents ==="
    pwd
    ls -la
    displayName: 'List Repository Files'
