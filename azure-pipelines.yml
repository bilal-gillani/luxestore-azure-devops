trigger:
  - none

pool:
  vmImage: ubuntu-24.04

# ============================================================
# Pipeline Variables
# ============================================================
variables:
  - group: 'luxestore-secrets'

  - name: azureServiceConnection
    value: 'azure-service-connection-name'
  
  - name: acrName
    value: 'acr-name'
  - name: acrLoginServer
    value: '$(acrName).azurecr.io'

  # Image repository names inside ACR
  - name: backendRepository
    value: 'luxestore-backend'
  - name: frontendRepository
    value: 'luxestore-frontend'

  # Azure Infrastructure & Database Variables
  - name: resourceGroupName
    value: 'rg-name'
  - name: mysqlServerName
    value: 'mysql-server-name'
  - name: mysqlServerFqdn
    value: '$(mysqlServerName).mysql.database.azure.com'
  - name: mysqlAdminUsername
    value: 'sqladmin'

  # Remote Terraform State in Azure Storage
  - name: tfStorageResourceGroup
    value: 'tf-storage-rg-name'
  - name: tfStorageAccount
    value: 'tf-storage-account-name'
  - name: tfStateContainer
    value: 'tfstate'
  - name: tfStateKey
    value: 'tf-state-key'

stages:
  # ============================================================
  # Stage 1: Build & Security Scan Stage (Continuous Integration - CI)
  # ============================================================
  - stage: Build
    displayName: 'Build, Scan & Push (CI)'
    jobs:
      - job: BuildAndPushJob
        displayName: 'Security Scan, Build & Push Images'
        steps:
          - script: mkdir -p "$(Build.ArtifactStagingDirectory)/CodeAnalysisLogs"
            displayName: 'Prepare scan output folder'
            
          - script: |
              pwd
              ls -lah
              echo "=== Downloading & Running Gitleaks ==="
              # We use a docker container for Gitleaks so it's clean and versioned
              docker run --rm -v $(System.DefaultWorkingDirectory):/path \
                -v $(Build.ArtifactStagingDirectory)/CodeAnalysisLogs:/out \
                zricethezav/gitleaks:v8.30.1 detect --source=/path -v --redact \
                --report-format sarif --report-path /out/gitleaks.sarif
              exit_code=$?
              echo "Gitleaks exit code: $exit_code"

              if [ $exit_code -eq 0 ]; then
                echo "No secrets found."
              elif [ $exit_code -eq 1 ]; then
                echo "##vso[task.logissue type=warning]Gitleaks found potential secrets — review scan output above."
                echo "##vso[task.complete result=SucceededWithIssues;]"
              else
                echo "Gitleaks failed to run properly (exit code $exit_code) — this is a tooling issue, not a detection result."
                exit $exit_code
              fi
            displayName: 'Secrets Scan (Gitleaks)'

          - script: |
              echo "=== Running SAST Scan (Semgrep) ==="
              # We use a docker container for Semgrep
              docker run --rm -v $(System.DefaultWorkingDirectory):/src \
                -v $(Build.ArtifactStagingDirectory)/CodeAnalysisLogs:/out \
                semgrep/semgrep:v1.178.0 semgrep scan --config=auto --error \
                --sarif-output=/out/semgrep.sarif /src
              exit_code=$?
              echo "Semgrep exit code: $exit_code"
              
              if [ $exit_code -eq 0 ]; then
                echo "No SAST issues found."
              elif [ $exit_code -eq 1 ]; then
                echo "##vso[task.logissue type=warning]Semgrep found potential security issues — review scan output above."
                echo "##vso[task.complete result=SucceededWithIssues;]"
              else
                echo "Semgrep failed to run properly (exit code $exit_code) — this is a tooling issue, not a detection result."
                exit $exit_code
              fi
            displayName: 'SAST Scan (Semgrep)'

          - script: |
              echo "=== Running SCA Scan (Trivy fs) ==="
              # We use a docker container for Trivy filesystem scan
              docker run --rm -v $(System.DefaultWorkingDirectory):/path \
                -v $(Build.ArtifactStagingDirectory)/CodeAnalysisLogs:/out \
                aquasec/trivy:v0.74.0 fs --scanners vuln,license --severity HIGH,CRITICAL \
                --exit-code 1 --format json --output /out/trivy-fs.json /path
              exit_code=$?
              echo "Trivy exit code: $exit_code"

              docker run --rm -v $(Build.ArtifactStagingDirectory)/CodeAnalysisLogs:/out \
                aquasec/trivy:v0.74.0 convert --format table /out/trivy-fs.json

              docker run --rm -v $(Build.ArtifactStagingDirectory)/CodeAnalysisLogs:/out \
                aquasec/trivy:v0.74.0 convert --format sarif --output /out/trivy-fs.sarif /out/trivy-fs.json
              
              if [ $exit_code -eq 0 ]; then
                echo "No HIGH/CRITICAL issues found."
              elif [ $exit_code -eq 1 ]; then
                echo "##vso[task.logissue type=warning]Trivy found HIGH/CRITICAL issues — review scan output above."
                echo "##vso[task.complete result=SucceededWithIssues;]"
              else
                echo "Trivy failed to run properly (exit code $exit_code) — this is a tooling issue, not a detection result."
                exit $exit_code
              fi
            displayName: 'SCA Scan (Trivy fs)'

          - script: |
              echo "=== Running IaC Scan (Checkov) ==="
              docker run --rm -v $(System.DefaultWorkingDirectory):/repo \
                -v $(Build.ArtifactStagingDirectory)/CodeAnalysisLogs:/out \
                bridgecrew/checkov:3.3.19 -d /repo --framework terraform dockerfile \
                --soft-fail --quiet -o cli -o sarif --output-file-path console,/out/checkov.sarif
              exit_code=$?

              SARIF="$(Build.ArtifactStagingDirectory)/CodeAnalysisLogs/checkov.sarif"
              if [ $exit_code -ne 0 ]; then
                echo "Checkov failed to run (exit $exit_code)"; exit $exit_code
              elif [ ! -s "$SARIF" ]; then
                echo "##vso[task.logissue type=warning]Checkov SARIF was not produced"
              else
                n=$(jq '[.runs[].results[]?] | length' "$SARIF")
                if [ "$n" -gt 0 ]; then
                  echo "##vso[task.logissue type=warning]Checkov reported $n failed checks — review output above."
                  echo "##vso[task.complete result=SucceededWithIssues;]"
                fi
              fi
            displayName: 'IaC Scan (Checkov)'

          # The SP (with AcrPush role on ACR) logs Docker into the registry.
          # Credentials are stored in ~/.docker/config.json on the agent
          # and persist for all subsequent steps in this job.
          - task: AzureCLI@2
            displayName: 'Login to ACR'
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                echo "=== Authenticating Docker to ACR ==="
                az acr login --name $(acrName)
                echo "✅ Logged in to $(acrLoginServer)"

          - task: AzureCLI@2
            displayName: 'Build Backend Docker Image'
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                echo "=== Building Backend Image ==="
                docker build \
                  -t $(acrLoginServer)/$(backendRepository):$(Build.BuildId) \
                  -t $(acrLoginServer)/$(backendRepository):latest \
                  -f ecommerce-backend/Dockerfile \
                  ecommerce-backend/
                echo "✅ Backend image built: $(acrLoginServer)/$(backendRepository):$(Build.BuildId)"

          - script: |
              echo "=== Scanning Backend Image (OS only) ==="
              docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
                -v $(Build.ArtifactStagingDirectory)/CodeAnalysisLogs:/out \
                aquasec/trivy:v0.74.0 image --scanners vuln --pkg-types os --severity HIGH,CRITICAL \
                --exit-code 1 --format json --output /out/trivy-backend.json \
                $(acrLoginServer)/$(backendRepository):$(Build.BuildId)
              exit_code=$?
              echo "Trivy exit code: $exit_code"

              docker run --rm -v $(Build.ArtifactStagingDirectory)/CodeAnalysisLogs:/out \
                aquasec/trivy:v0.74.0 convert --format table /out/trivy-backend.json

              docker run --rm -v $(Build.ArtifactStagingDirectory)/CodeAnalysisLogs:/out \
                aquasec/trivy:v0.74.0 convert --format sarif --output /out/trivy-backend.sarif /out/trivy-backend.json

              if [ $exit_code -eq 0 ]; then
                echo "No HIGH/CRITICAL issues found in backend image."
              elif [ $exit_code -eq 1 ]; then
                echo "##vso[task.logissue type=warning]Trivy found HIGH/CRITICAL issues in backend image — review scan output above."
                echo "##vso[task.complete result=SucceededWithIssues;]"
              else
                echo "Trivy failed to run properly (exit code $exit_code) — this is a tooling issue, not a detection result."
                exit $exit_code
              fi
            displayName: 'Trivy Image Scan (Backend)'

          - task: AzureCLI@2
            displayName: 'Push Backend Image to ACR'
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                echo "=== Pushing Backend Image ==="
                docker push $(acrLoginServer)/$(backendRepository):$(Build.BuildId)
                docker push $(acrLoginServer)/$(backendRepository):latest
                echo "✅ Backend pushed → $(acrLoginServer)/$(backendRepository):$(Build.BuildId)"

          - task: AzureCLI@2
            displayName: 'Build Frontend Docker Image'
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                echo "=== Building Frontend Image ==="
                docker build \
                  -t $(acrLoginServer)/$(frontendRepository):$(Build.BuildId) \
                  -t $(acrLoginServer)/$(frontendRepository):latest \
                  -f html/Dockerfile \
                  html/
                echo "✅ Frontend image built: $(acrLoginServer)/$(frontendRepository):$(Build.BuildId)"

          - script: |
              echo "=== Scanning Frontend Image (OS only) ==="
              docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
                -v $(Build.ArtifactStagingDirectory)/CodeAnalysisLogs:/out \
                aquasec/trivy:v0.74.0 image --scanners vuln --pkg-types os --severity HIGH,CRITICAL \
                --exit-code 1 --format json --output /out/trivy-frontend.json \
                $(acrLoginServer)/$(frontendRepository):$(Build.BuildId)
              exit_code=$?
              echo "Trivy exit code: $exit_code"

              docker run --rm -v $(Build.ArtifactStagingDirectory)/CodeAnalysisLogs:/out \
                aquasec/trivy:v0.74.0 convert --format table /out/trivy-frontend.json

              docker run --rm -v $(Build.ArtifactStagingDirectory)/CodeAnalysisLogs:/out \
                aquasec/trivy:v0.74.0 convert --format sarif --output /out/trivy-frontend.sarif /out/trivy-frontend.json

              if [ $exit_code -eq 0 ]; then
                echo "No HIGH/CRITICAL issues found in frontend image."
              elif [ $exit_code -eq 1 ]; then
                echo "##vso[task.logissue type=warning]Trivy found HIGH/CRITICAL issues in frontend image — review scan output above."
                echo "##vso[task.complete result=SucceededWithIssues;]"
              else
                echo "Trivy failed to run properly (exit code $exit_code) — this is a tooling issue, not a detection result."
                exit $exit_code
              fi
            displayName: 'Trivy Image Scan (Frontend)'

          - task: AzureCLI@2
            displayName: 'Push Frontend Image to ACR'
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                echo "=== Pushing Frontend Image ==="
                docker push $(acrLoginServer)/$(frontendRepository):$(Build.BuildId)
                docker push $(acrLoginServer)/$(frontendRepository):latest
                echo "✅ Frontend pushed → $(acrLoginServer)/$(frontendRepository):$(Build.BuildId)"

          - script: |
              shopt -s nullglob
              OUT="$(Build.ArtifactStagingDirectory)/CodeAnalysisLogs"
              MD="$(Build.ArtifactStagingDirectory)/security-summary.md"
              {
                echo "| Tool | Error | Warning | Note | Total |"
                echo "|---|---:|---:|---:|---:|"
                for f in "$OUT"/*.sarif; do
                  jq -r '
                    (input_filename | split("/")[-1] | sub("\\.sarif$";"")) as $t
                    | [ .runs[]
                        | (.tool.driver.rules // []) as $rules
                        | .results[]?
                        | (.level
                          // (if .ruleIndex != null then $rules[.ruleIndex].defaultConfiguration.level else null end)
                          // "warning")
                      ] as $l
                    | "| \($t) | \($l|map(select(.=="error"))|length) | \($l|map(select(.=="warning"))|length) | \($l|map(select(.=="note"))|length) | \($l|length) |"
                  ' "$f"
                done
                for t in gitleaks semgrep trivy-fs trivy-backend trivy-frontend checkov; do
                  [ -s "$OUT/$t.sarif" ] || echo "| ⚠️ $t | no SARIF produced | | | |"
                done
                echo; echo "**Top findings (10 per tool)**"; echo
                echo "| Tool | Rule | Message | Location |"
                echo "|---|---|---|---|"
                for f in "$OUT"/*.sarif; do
                  jq -r '
                    (input_filename | split("/")[-1] | sub("\\.sarif$";"")) as $t
                    | [.runs[].results[]?][:10][]
                    | (.locations[0].physicalLocation.artifactLocation.uri // "-" | sub("^/?(src|path|repo)/";"")) as $u
                    | "| \($t) | `\(.ruleId)` | \(.message.text | gsub("[\\n|]";" ") | .[0:160]) | `\($u):\(.locations[0].physicalLocation.region.startLine // "")` |"
                  ' "$f"
                done
              } > "$MD"
              echo "##vso[task.addattachment type=Distributedtask.Core.Summary;name=Security scan findings]$MD"
            displayName: 'Publish Security Findings Summary'
            condition: always()

  # ============================================================
  # Stage 2: Terraform Plan
  # Fetches the current live (blue) revision suffixes from Azure,
  # then runs TF Init + Plan. Plan output published as artifact for
  # approver to review before the TrafficSwitch stage approval fires.
  # ============================================================
  - stage: TerraformPlan
    displayName: 'Terraform Plan'
    dependsOn: Build
    condition: succeeded()
    jobs:
      - job: TerraformPlanJob
        displayName: 'Fetch Blue Revisions & Terraform Plan'
        steps:
          # --- Step 1: Fetch current blue revision suffixes ---
          # Queries Azure for the revision currently serving 100% traffic on
          # each container app. Strips the "appname--" prefix to get the suffix.
          # If the app doesn't exist yet (first run), sets isBootstrap=true.
          - task: AzureCLI@2
            displayName: 'Fetch Blue Revision Suffixes'
            name: FetchBlueRevisions
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail

                echo "=== Fetching current live (blue) revision suffixes ==="

                # Get full name of the backend revision at 100% traffic
                BACKEND_FULL=$(az containerapp revision list \
                  --name backend \
                  --resource-group "$(resourceGroupName)" \
                  --query "[?properties.trafficWeight==\`100\`].name" \
                  -o tsv 2>/dev/null || echo "")
                BACKEND_BLUE="${BACKEND_FULL#backend--}"

                # Get full name of the frontend revision at 100% traffic
                FRONTEND_FULL=$(az containerapp revision list \
                  --name frontend \
                  --resource-group "$(resourceGroupName)" \
                  --query "[?properties.trafficWeight==\`100\`].name" \
                  -o tsv 2>/dev/null || echo "")
                FRONTEND_BLUE="${FRONTEND_FULL#frontend--}"

                # Determine bootstrap mode
                if [ -z "$BACKEND_BLUE" ]; then
                  IS_BOOTSTRAP="true"
                  BACKEND_BLUE="none"
                  FRONTEND_BLUE="none"
                  echo "🚀 First run detected (bootstrap mode) — no blue revisions exist yet."
                else
                  IS_BOOTSTRAP="false"
                  echo "🔵 Blue backend revision:  $BACKEND_BLUE"
                  echo "🔵 Blue frontend revision: $FRONTEND_BLUE"
                fi

                echo "🟢 Green revision suffix:  v-$(Build.BuildId)"
                echo "Bootstrap mode: $IS_BOOTSTRAP"

                # Output variables for use in this and subsequent stages
                echo "##vso[task.setvariable variable=isBootstrap;isOutput=true]$IS_BOOTSTRAP"
                echo "##vso[task.setvariable variable=backendBlueSuffix;isOutput=true]$BACKEND_BLUE"
                echo "##vso[task.setvariable variable=frontendBlueSuffix;isOutput=true]$FRONTEND_BLUE"

          - task: TerraformInstaller@1
            displayName: 'Install Terraform'
            inputs:
              terraformVersion: 'latest'

          - task: TerraformTask@5
            displayName: 'Terraform Init'
            inputs:
              provider: 'azurerm'
              command: 'init'
              workingDirectory: '$(System.DefaultWorkingDirectory)/infra'
              backendServiceArm: '$(azureServiceConnection)'
              backendAzureRmResourceGroupName: '$(tfStorageResourceGroup)'
              backendAzureRmStorageAccountName: '$(tfStorageAccount)'
              backendAzureRmContainerName: '$(tfStateContainer)'
              backendAzureRmKey: '$(tfStateKey)'

          # Plan with blue_traffic_weight=100, green_traffic_weight=0.
          # This shows the approver exactly what DeployGreen will create.
          - task: TerraformTask@5
            displayName: 'Terraform Plan'
            inputs:
              provider: 'azurerm'
              command: 'plan'
              workingDirectory: '$(System.DefaultWorkingDirectory)/infra'
              commandOptions: >-
                -out tfplan
                -var="resource_group_name=$(resourceGroupName)"
                -var="mysql_server_name=$(mysqlServerName)"
                -var="db_password=$(APP_DB_PASSWORD)"
                -var="acr_name=$(acrName)"
                -var="jwt_secret=$(JWT_SECRET)"
                -var="image_tag=$(Build.BuildId)"
                -var="green_revision_suffix=v-$(Build.BuildId)"
                -var="backend_blue_revision_suffix=$(FetchBlueRevisions.backendBlueSuffix)"
                -var="frontend_blue_revision_suffix=$(FetchBlueRevisions.frontendBlueSuffix)"
                -var="is_initial_deployment=$(FetchBlueRevisions.isBootstrap)"
                -var="blue_traffic_weight=100"
                -var="green_traffic_weight=0"
              environmentServiceNameAzureRM: '$(azureServiceConnection)'
              environmentAzureRmUseIdTokenGeneration: true

          # Convert binary tfplan to human-readable text for approver review.
          - script: |
              set -euo pipefail
              cd infra
              terraform show -no-color tfplan > tfplan.txt

              # Stage each artifact in its own folder so only these files are published
              # (no .terraform/ provider binaries or backend config).
              mkdir -p "$(Build.ArtifactStagingDirectory)/plan-review" \
                       "$(Build.ArtifactStagingDirectory)/plan-binary"
              cp tfplan.txt "$(Build.ArtifactStagingDirectory)/plan-review/"
              cp tfplan     "$(Build.ArtifactStagingDirectory)/plan-binary/"
              echo "📋 Plan rendered — approver: review the terraform-plan-review artifact."
              {
                echo '```'
                head -n 400 tfplan.txt
                echo '```'
                [ "$(wc -l < tfplan.txt)" -gt 400 ] && echo '_Truncated. Full plan is in the terraform-plan-review artifact._'
              } > "$(Build.ArtifactStagingDirectory)/plan-summary.md"
              echo "##vso[task.addattachment type=Distributedtask.Core.Summary;name=Terraform plan]$(Build.ArtifactStagingDirectory)/plan-summary.md"
            displayName: 'Prepare Terraform Plan Artifacts'

          # Human-readable plan: this is what the DeployGreen approver opens.
          - task: PublishPipelineArtifact@1
            displayName: 'Publish Plan (Review — tfplan.txt)'
            inputs:
              targetPath: '$(Build.ArtifactStagingDirectory)/plan-review'
              artifact: 'terraform-plan-review'
              publishLocation: 'pipeline'

          # Binary plan: consumed only by the DeployGreen apply.
          - task: PublishPipelineArtifact@1
            displayName: 'Publish Plan (Binary — tfplan)'
            inputs:
              targetPath: '$(Build.ArtifactStagingDirectory)/plan-binary'
              artifact: 'terraform-plan'
              publishLocation: 'pipeline'

  # ============================================================
  # Stage 3: Deploy Green
  # Deploys new image as a GREEN revision at 0% traffic (normal mode)
  # or at 100% traffic (bootstrap/first run). No approval gate.
  # Users are completely unaffected in normal mode.
  # ============================================================
  - stage: DeployGreen
    displayName: 'Deploy Green Revision (0% traffic)'
    dependsOn: TerraformPlan
    condition: succeeded()
    variables:
      # Consume output variables from Stage 2's FetchBlueRevisions step
      isBootstrap: $[ stageDependencies.TerraformPlan.TerraformPlanJob.outputs['FetchBlueRevisions.isBootstrap'] ]
      backendBlueSuffix: $[ stageDependencies.TerraformPlan.TerraformPlanJob.outputs['FetchBlueRevisions.backendBlueSuffix'] ]
      frontendBlueSuffix: $[ stageDependencies.TerraformPlan.TerraformPlanJob.outputs['FetchBlueRevisions.frontendBlueSuffix'] ]
    jobs:
      - deployment: DeployGreenJob
        displayName: 'TF Apply — Green Revision + DB Init'
        environment: 'staging'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                
                - task: TerraformInstaller@1
                  displayName: 'Install Terraform'
                  inputs:
                    terraformVersion: 'latest'

                # In a deployment job, artifacts are automatically downloaded to $(Pipeline.Workspace).
                # We copy the approved tfplan from the downloaded artifact into our working directory.
                - script: |
                    echo "=== Copying approved tfplan from Stage 2 artifact ==="
                    cp $(Pipeline.Workspace)/terraform-plan/tfplan $(System.DefaultWorkingDirectory)/infra/
                  displayName: 'Retrieve Approved Terraform Plan'

                # Re-run Init — fresh agent, provider plugins need reinstalling.
                - task: TerraformTask@5
                  displayName: 'Terraform Init'
                  inputs:
                    provider: 'azurerm'
                    command: 'init'
                    workingDirectory: '$(System.DefaultWorkingDirectory)/infra'
                    backendServiceArm: '$(azureServiceConnection)'
                    backendAzureRmResourceGroupName: '$(tfStorageResourceGroup)'
                    backendAzureRmStorageAccountName: '$(tfStorageAccount)'
                    backendAzureRmContainerName: '$(tfStateContainer)'
                    backendAzureRmKey: '$(tfStateKey)'

                # Apply: creates green revision using the approved plan from Stage 2.
                # Normal mode: green at 0% traffic, blue unchanged at 100%.
                # Bootstrap mode: single revision at 100% (latest_revision=true).
                - task: TerraformTask@5
                  displayName: 'Terraform Apply — Deploy Green Revision'
                  inputs:
                    provider: 'azurerm'
                    command: 'apply'
                    workingDirectory: '$(System.DefaultWorkingDirectory)/infra'
                    commandOptions: 'tfplan'
                    environmentServiceNameAzureRM: '$(azureServiceConnection)'
                    environmentAzureRmUseIdTokenGeneration: true

                # DB init runs once after infrastructure is ready.
                # Idempotent script — safe to run on every pipeline execution.
                - task: AzureCLI@2
                  displayName: 'Initialize & Seed Azure MySQL Database'
                  inputs:
                    azureSubscription: '$(azureServiceConnection)'
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail
                      echo "=== Installing MySQL Client ==="
                      sudo apt-get update -qq && sudo apt-get install -y -qq default-mysql-client

                      echo "=== Executing Database Initialization Script ==="
                      chmod +x scripts/init-db.sh
                      ./scripts/init-db.sh "$(mysqlServerFqdn)" "$(mysqlAdminUsername)"
                  env:
                    MYSQL_ADMIN_PASSWORD: $(MYSQL_ADMIN_PASSWORD)
                    APP_DB_PASSWORD: $(APP_DB_PASSWORD)

  # ============================================================
  # Stage 4: Smoke Tests
  # Runs automated health checks against the GREEN revision.
  # Normal mode: tests the ---green label URL (staging endpoint).
  # Bootstrap mode: tests the main app URL (green IS the live revision).
  # If smoke tests fail, TrafficSwitch stage never runs → production safe.
  # ============================================================
  - stage: SmokeTests
    displayName: 'Smoke Tests (Green Revision)'
    dependsOn:
      - TerraformPlan   # required: stageDependencies only resolves outputs from directly-listed stages
      - DeployGreen
    condition: succeeded('DeployGreen')
    variables:
      isBootstrap: $[ stageDependencies.TerraformPlan.TerraformPlanJob.outputs['FetchBlueRevisions.isBootstrap'] ]
    jobs:
      - job: SmokeTestJob
        displayName: 'Smoke Tests — Green Revision Health Check'
        steps:
          - task: AzureCLI@2
            displayName: 'Run Smoke Tests Against Green Revision'
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail

                # Get the main frontend FQDN
                MAIN_FQDN=$(az containerapp show \
                  --name frontend \
                  --resource-group "$(resourceGroupName)" \
                  --query "properties.configuration.ingress.fqdn" -o tsv)

                if [ "$(isBootstrap)" = "true" ]; then
                  # Bootstrap: green IS the main revision at 100% — test main URL directly
                  TEST_URL="https://$MAIN_FQDN"
                  echo "🚀 Bootstrap mode: testing main URL → $TEST_URL"
                else
                  # Normal: green is at 0% behind the ---green label URL
                  # Label URL format: appname---label.{hash}.region.azurecontainerapps.io
                  GREEN_FQDN=$(echo "$MAIN_FQDN" | sed 's/^frontend\./frontend---green./')
                  TEST_URL="https://$GREEN_FQDN"
                  echo "🟢 Normal mode: testing green label URL → $TEST_URL"
                fi

                echo "=== Running Smoke Tests ==="

                # Give the new revision up to 60s to become ready
                echo "Waiting 20s for revision to stabilise..."
                sleep 20

                # Test 1: Frontend homepage returns HTTP 200
                STATUS=$(curl -sf -o /dev/null -w "%{http_code}" --max-time 30 "$TEST_URL/" || echo "000")
                if [ "$STATUS" = "200" ]; then
                  echo "✅ Test 1 PASSED — Homepage: HTTP $STATUS"
                else
                  echo "❌ Test 1 FAILED — Homepage: HTTP $STATUS (expected 200)"
                  exit 1
                fi

                # Test 2: API health endpoint returns HTTP 200 via nginx proxy
                STATUS=$(curl -sf -o /dev/null -w "%{http_code}" --max-time 30 "$TEST_URL/api/health" || echo "000")
                if [ "$STATUS" = "200" ]; then
                  echo "✅ Test 2 PASSED — API health: HTTP $STATUS"
                else
                  echo "❌ Test 2 FAILED — API health: HTTP $STATUS (expected 200)"
                  exit 1
                fi

                echo "=================================================="
                echo "✅ All smoke tests passed! Green revision is healthy."
                echo "   URL tested: $TEST_URL"
                echo "=================================================="

  # ============================================================
  # Stage 5: Traffic Switch (Production Approval Gate)
  # SKIPPED on bootstrap (isBootstrap=true) — green is already live at 100%.
  # On normal runs: approval fires here. Approver reviews:
  #   - Stage 2 TF Plan artifact (terraform-plan → tfplan.txt)
  #   - Stage 4 smoke test results
  #   - Green app live at the ---green label URL
  # On approval: Terraform apply flips blue=0%, green=100%.
  #
  # SETUP REQUIRED (one-time):
  #   Pipelines → Environments → New → name: "production"
  #   → Approvals and checks → + → Approvals → add approver → Save
  # ============================================================
  - stage: TrafficSwitch
    displayName: 'Traffic Switch — Green to Production (Gated)'
    dependsOn:
      - TerraformPlan
      - SmokeTests
    # Skip entirely on bootstrap: green is already at 100%, nothing to switch.
    # NOTE: Stage conditions must use 'dependencies' syntax (not 'stageDependencies').
    # Key format: dependencies.Stage.outputs['Job.StepName.variable']
    # The 'stageDependencies' syntax only works in the variables: block ($[...] expressions).
    condition: |
      and(
        succeeded('SmokeTests'),
        eq(dependencies.TerraformPlan.outputs['TerraformPlanJob.FetchBlueRevisions.isBootstrap'], 'false')
      )
    variables:
      backendBlueSuffix: $[ stageDependencies.TerraformPlan.TerraformPlanJob.outputs['FetchBlueRevisions.backendBlueSuffix'] ]
      frontendBlueSuffix: $[ stageDependencies.TerraformPlan.TerraformPlanJob.outputs['FetchBlueRevisions.frontendBlueSuffix'] ]
    jobs:
      - deployment: TrafficSwitchJob
        displayName: 'Switch Traffic — Blue 0% → Green 100%'
        environment: 'production'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - task: TerraformInstaller@1
                  displayName: 'Install Terraform'
                  inputs:
                    terraformVersion: 'latest'

                - task: TerraformTask@5
                  displayName: 'Terraform Init'
                  inputs:
                    provider: 'azurerm'
                    command: 'init'
                    workingDirectory: '$(System.DefaultWorkingDirectory)/infra'
                    backendServiceArm: '$(azureServiceConnection)'
                    backendAzureRmResourceGroupName: '$(tfStorageResourceGroup)'
                    backendAzureRmStorageAccountName: '$(tfStorageAccount)'
                    backendAzureRmContainerName: '$(tfStateContainer)'
                    backendAzureRmKey: '$(tfStateKey)'

                # Re-plan with FLIPPED weights: green=100%, blue=0%.
                # No new revision is created — only traffic routing changes.
                - task: TerraformTask@5
                  displayName: 'Terraform Plan — Traffic Switch (green=100%, blue=0%)'
                  inputs:
                    provider: 'azurerm'
                    command: 'plan'
                    workingDirectory: '$(System.DefaultWorkingDirectory)/infra'
                    commandOptions: >-
                      -out tfplan
                      -var="resource_group_name=$(resourceGroupName)"
                      -var="mysql_server_name=$(mysqlServerName)"
                      -var="db_password=$(APP_DB_PASSWORD)"
                      -var="acr_name=$(acrName)"
                      -var="jwt_secret=$(JWT_SECRET)"
                      -var="image_tag=$(Build.BuildId)"
                      -var="green_revision_suffix=v-$(Build.BuildId)"
                      -var="backend_blue_revision_suffix=$(backendBlueSuffix)"
                      -var="frontend_blue_revision_suffix=$(frontendBlueSuffix)"
                      -var="is_initial_deployment=false"
                      -var="blue_traffic_weight=0"
                      -var="green_traffic_weight=100"
                    environmentServiceNameAzureRM: '$(azureServiceConnection)'
                    environmentAzureRmUseIdTokenGeneration: true

                # Apply: flips all user traffic to the green revision.
                # Old blue revision remains dormant — instant rollback available.
                - task: TerraformTask@5
                  displayName: 'Terraform Apply — Switch Traffic to Green'
                  inputs:
                    provider: 'azurerm'
                    command: 'apply'
                    workingDirectory: '$(System.DefaultWorkingDirectory)/infra'
                    commandOptions: 'tfplan'
                    environmentServiceNameAzureRM: '$(azureServiceConnection)'
                    environmentAzureRmUseIdTokenGeneration: true

                # Verify and output live URLs after traffic switch.
                - task: AzureCLI@2
                  displayName: 'Verify & Output Production URLs'
                  inputs:
                    azureSubscription: '$(azureServiceConnection)'
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail
                      FRONTEND_FQDN=$(az containerapp show \
                        --resource-group "$(resourceGroupName)" \
                        --name frontend \
                        --query "properties.configuration.ingress.fqdn" -o tsv || echo "")
                      BACKEND_FQDN=$(az containerapp show \
                        --resource-group "$(resourceGroupName)" \
                        --name backend \
                        --query "properties.configuration.ingress.fqdn" -o tsv || echo "")

                      echo "=================================================="
                      echo "🚀 Traffic Switch Complete!"
                      echo "🟢 Green revision v-$(Build.BuildId) is now LIVE at 100% traffic"
                      echo "🌐 Frontend Production URL: https://$FRONTEND_FQDN"
                      echo "⚙️  Backend Internal FQDN:  $BACKEND_FQDN"
                      echo "🔵 Old blue revision is dormant — rollback available instantly"
                      echo "=================================================="

  # ============================================================
  # Stage 6: Post-Deployment Verification & Automated Rollback
  # Runs after traffic is switched to green. It executes a KQL 
  # query against the Log Analytics Workspace to detect errors.
  # If errors are found in the new revision, it automatically 
  # executes a Terraform rollback, flipping traffic back to blue.
  # ============================================================
  - stage: RollbackVerification
    displayName: 'Post-Deployment Verification & Rollback'
    dependsOn:
      - TerraformPlan
      - TrafficSwitch
    condition: |
      and(
        succeeded('TrafficSwitch'),
        eq(dependencies.TerraformPlan.outputs['TerraformPlanJob.FetchBlueRevisions.isBootstrap'], 'false')
      )
    variables:
      backendBlueSuffix: $[ stageDependencies.TerraformPlan.TerraformPlanJob.outputs['FetchBlueRevisions.backendBlueSuffix'] ]
      frontendBlueSuffix: $[ stageDependencies.TerraformPlan.TerraformPlanJob.outputs['FetchBlueRevisions.frontendBlueSuffix'] ]
    jobs:
      - job: VerificationJob
        displayName: 'Verify Logs and Rollback if needed'
        steps:
          - task: AzureCLI@2
            displayName: 'Query Log Analytics & Rollback'
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                
                FRONTEND_FQDN=$(az containerapp show \
                  --resource-group "$(resourceGroupName)" \
                  --name frontend \
                  --query "properties.configuration.ingress.fqdn" -o tsv)
                  
                echo "=== Simulating Production Traffic (Hitting Poison Endpoint) ==="
                curl -s -f "https://$FRONTEND_FQDN/api/demo-error" || echo "Hit error endpoint as planned."
                
                echo "Waiting 30 seconds for logs to reach Log Analytics Workspace..."
                sleep 30
                
                WORKSPACE_ID=$(az monitor log-analytics workspace show \
                  --resource-group "$(resourceGroupName)" \
                  --workspace-name "log-analytics-workspace-name" \
                  --query "customerId" -o tsv)
                  
                echo "=== Querying Log Analytics Workspace for Errors in Revision: v-$(Build.BuildId) ==="
                
                # The KQL Query
                QUERY="union isfuzzy=true ContainerAppSystemLogs_CL, ContainerAppConsoleLogs_CL | where TimeGenerated > ago(10m) | where RevisionName_s contains 'backend--v-$(Build.BuildId)' | where Log_s has_any ('ERROR', 'Exception', 'CrashLoopBackOff', 'Failed', 'fatal')"
                
                az monitor log-analytics query \
                  --workspace "$WORKSPACE_ID" \
                  --analytics-query "$QUERY" > query_results.json
                  
                ERROR_COUNT=$(jq '. | length' query_results.json)
                
                echo "Errors found: $ERROR_COUNT"
                
                if [ "$ERROR_COUNT" -gt 0 ]; then
                  echo "🚨 CRITICAL ERROR DETECTED IN PRODUCTION LOGS!"
                  echo "🚨 INITIATING AUTOMATED ROLLBACK..."
                  
                  # Save a flag so the next step knows to run terraform
                  echo "##vso[task.setvariable variable=ROLLBACK_REQUIRED]true"
                else
                  echo "✅ No errors detected. Deployment is healthy."
                  echo "##vso[task.setvariable variable=ROLLBACK_REQUIRED]false"
                fi
                
          # --- The Rollback Steps ---
          # Only runs if the previous step found errors.
          - task: TerraformInstaller@1
            displayName: 'Install Terraform for Rollback'
            condition: eq(variables['ROLLBACK_REQUIRED'], 'true')
            inputs:
              terraformVersion: 'latest'

          - task: TerraformTask@5
            displayName: 'Terraform Init (Rollback)'
            condition: eq(variables['ROLLBACK_REQUIRED'], 'true')
            inputs:
              provider: 'azurerm'
              command: 'init'
              workingDirectory: '$(System.DefaultWorkingDirectory)/infra'
              backendServiceArm: '$(azureServiceConnection)'
              backendAzureRmResourceGroupName: '$(tfStorageResourceGroup)'
              backendAzureRmStorageAccountName: '$(tfStorageAccount)'
              backendAzureRmContainerName: '$(tfStateContainer)'
              backendAzureRmKey: '$(tfStateKey)'
              
          - task: TerraformTask@5
            displayName: 'Terraform Apply — ROLLBACK to Blue (green=0%, blue=100%)'
            condition: eq(variables['ROLLBACK_REQUIRED'], 'true')
            inputs:
              provider: 'azurerm'
              command: 'apply'
              workingDirectory: '$(System.DefaultWorkingDirectory)/infra'
              # We pass variables directly to apply without a plan via -auto-approve
              commandOptions: >-
                -auto-approve
                -var="resource_group_name=$(resourceGroupName)"
                -var="mysql_server_name=$(mysqlServerName)"
                -var="db_password=$(APP_DB_PASSWORD)"
                -var="acr_name=$(acrName)"
                -var="jwt_secret=$(JWT_SECRET)"
                -var="image_tag=$(Build.BuildId)"
                -var="green_revision_suffix=v-$(Build.BuildId)"
                -var="backend_blue_revision_suffix=$(backendBlueSuffix)"
                -var="frontend_blue_revision_suffix=$(frontendBlueSuffix)"
                -var="is_initial_deployment=false"
                -var="blue_traffic_weight=100"
                -var="green_traffic_weight=0"
              environmentServiceNameAzureRM: '$(azureServiceConnection)'
              environmentAzureRmUseIdTokenGeneration: true
              
          - script: |
              echo "❌ ROLLBACK COMPLETE. The deployment was aborted and traffic was successfully reverted to the blue revision."
              exit 1
            displayName: 'Fail Pipeline (Rollback Complete)'
            condition: eq(variables['ROLLBACK_REQUIRED'], 'true')
