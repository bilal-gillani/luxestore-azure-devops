<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout — LuxeStore</title>
    <meta name="description" content="Complete your purchase at LuxeStore.">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<nav class="navbar" id="navbar"></nav>

<div class="container">
    <div class="page-header">
        <div class="breadcrumb">
            <a href="/index.html">🏠 Home</a>
            <span class="breadcrumb-sep">›</span>
            <a href="/cart.html">Cart</a>
            <span class="breadcrumb-sep">›</span>
            <span>Checkout</span>
        </div>
        <h1>🎉 Checkout</h1>
    </div>

    <!-- Success State (hidden by default) -->
    <div id="order-success" class="hidden" style="padding:60px 0;text-align:center;">
        <div style="font-size:4rem;margin-bottom:20px;animation:badge-pop .5s cubic-bezier(0.34,1.56,0.64,1);">🎉</div>
        <h2 style="margin-bottom:12px;">Order Placed Successfully!</h2>
        <p class="text-secondary" style="margin-bottom:8px;">
            Your order <strong style="color:var(--accent);" id="success-order-id"></strong> has been placed.
        </p>
        <p class="text-secondary" style="margin-bottom:32px;">
            Total charged: <strong style="color:var(--accent);" id="success-total"></strong>
        </p>
        <div style="display:flex;gap:14px;justify-content:center;flex-wrap:wrap;">
            <a href="/orders.html" class="btn btn-primary btn-lg">📦 View My Orders</a>
            <a href="/index.html" class="btn btn-secondary btn-lg">← Continue Shopping</a>
        </div>
    </div>

    <!-- Checkout Form -->
    <div id="checkout-form-wrap">
        <div class="checkout-layout">
            <!-- Shipping Form -->
            <div>
                <div class="card" style="margin-bottom:24px;">
                    <h3 style="margin-bottom:20px;display:flex;align-items:center;gap:10px;">
                        <span style="width:28px;height:28px;background:var(--accent);color:#000;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.85rem;font-weight:800;">1</span>
                        Shipping Information
                    </h3>
                    <form id="checkout-form" style="display:flex;flex-direction:column;gap:16px;">
                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label" for="ship-name">Full Name <span>*</span></label>
                                <input class="form-control" type="text" id="ship-name" placeholder="John Smith" required>
                            </div>
                            <div class="form-group">
                                <label class="form-label" for="ship-phone">Phone Number <span>*</span></label>
                                <input class="form-control" type="tel" id="ship-phone" placeholder="+1 555 000 0000" required>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="ship-address">Street Address <span>*</span></label>
                            <input class="form-control" type="text" id="ship-address" placeholder="123 Main Street, Apt 4B" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="ship-city">City / State / ZIP <span>*</span></label>
                            <input class="form-control" type="text" id="ship-city" placeholder="New York, NY 10001" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="ship-notes">Order Notes <span style="color:var(--text-muted);font-weight:400;">(optional)</span></label>
                            <textarea class="form-control" id="ship-notes" rows="3"
                                placeholder="Special delivery instructions, gift message, etc."></textarea>
                        </div>

                        <div style="border-top:1px solid var(--border);padding-top:20px;margin-top:4px;">
                            <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;padding:12px;background:var(--bg-secondary);border-radius:var(--radius);">
                                <span style="font-size:1.4rem;">💳</span>
                                <div>
                                    <div style="font-weight:600;font-size:.875rem;">Payment on Delivery</div>
                                    <div class="text-xs text-muted">Cash or card accepted upon delivery</div>
                                </div>
                            </div>
                            <button class="btn btn-primary btn-full btn-lg" type="submit" id="place-order-btn">
                                🎉 Place Order
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Order Review -->
            <div>
                <div class="order-summary">
                    <h3 style="margin-bottom:4px;display:flex;align-items:center;gap:10px;">
                        <span style="width:28px;height:28px;background:var(--accent);color:#000;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.85rem;font-weight:800;">2</span>
                        Order Review
                    </h3>
                    <p class="text-xs text-muted" style="margin-bottom:20px;padding-left:38px;">Review your items before placing the order</p>
                    <div id="order-review">
                        <div class="loading-overlay"><div class="spinner"></div></div>
                    </div>
                    <div style="margin-top:16px;font-size:.75rem;color:var(--text-muted);text-align:center;" id="total-display"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<footer class="footer" id="footer"></footer>

<script src="/js/config.js"></script>
<script src="/js/api.js"></script>
<script src="/js/components.js"></script>
<script src="/js/checkout.js"></script>
</body>
</html>
